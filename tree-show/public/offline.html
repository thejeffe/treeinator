<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0A0E15"><title>Treeinator is offline</title>
<style>
html,body{height:100%;margin:0}
body{background:#0A0E15;color:#eef2f5;font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;box-sizing:border-box}
main{max-width:420px}
@media (min-width:700px){main{max-width:640px}img{max-width:420px}h1{font-size:30px}}
img{width:100%;max-width:320px;height:auto;border-radius:16px;box-shadow:0 10px 40px #0008;image-rendering:auto}
h1{font-size:24px;margin:18px 0 6px;color:#f2c14e}
p{margin:0 0 14px;color:#b9c3cc}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:11px 22px;background:#f2c14e;color:#111;cursor:pointer}
small{display:block;margin-top:12px;color:#7d8894}
canvas{width:min(100%,600px,calc(62vh * var(--ar,1.88)));max-width:none;aspect-ratio:320/170;border-radius:16px;box-shadow:0 10px 40px #0008;touch-action:manipulation;cursor:pointer;display:block;margin:0 auto}
canvas[hidden]{display:none}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
button.ghost{background:transparent;color:inherit;box-shadow:inset 0 0 0 2px currentColor}
</style><style>html{touch-action:manipulation;-webkit-text-size-adjust:100%}</style><script>/* no zooming on phones (iPhone Safari ignores user-scalable=no for pinches, so stop the gesture itself) */['gesturestart','gesturechange'].forEach(function(k){document.addEventListener(k,function(e){e.preventDefault()},{passive:false})});document.addEventListener('touchmove',function(e){if(e.touches.length>1||(e.scale!==undefined&&e.scale!==1))e.preventDefault()},{passive:false});</script></head><body><main>
<img id="pic" src="/offline.gif" alt="The tree asleep, unplugged" width="320" height="240">
<canvas id="game" hidden aria-label="Catch the presents for Santa"></canvas>
<h1>Someone unplugged the tree.</h1>
<p>Treeinator isn’t answering right now. It’ll be back in a jiffy, and this page reloads by itself.</p>
<div class="btns"><button type="button" id="play">Play while you wait</button> <button type="button" id="again" class="ghost">Try again</button></div>
<small id="st">Checking every 5 seconds…</small>
</main>
<script>
// back as soon as Treeinator answers again
var watched = /[?&]down=1/.test(location.search);   // put here by the down watch (the app was open)
var back = watched ? decodeURIComponent((location.search.match(/[?&]back=([^&]*)/) || [])[1] || '/') : null;
var preview = /offline\.html$/.test(location.pathname) && !watched;   // opened from Settings to look at it
function goBack() { if (back) location.replace(back); else location.reload(); }
var n = 5, st = document.getElementById('st');
if (preview) { st.textContent = 'Preview: this is what the app shows when the server can’t be reached.'; var ag = document.getElementById('again'); ag.textContent = 'Back to the app'; ag.onclick = function () { location.href = '/'; }; }
function check() {
  fetch('/', { cache: 'no-store' }).then(function (r) { if (r.status < 500) goBack(); }).catch(function () {});
}
if (!preview) setInterval(function () { n--; if (n <= 0) { n = 5; check(); } st.textContent = navigator.onLine === false ? 'Your phone is offline: check its Wi-Fi.' : 'Checking again in ' + n + ' s…'; }, 1000);
if (!preview) document.getElementById('again').onclick = function () { st.textContent = 'Checking…'; check(); setTimeout(goBack, 600); };
if (!preview) window.addEventListener('online', check);
</script><script>
// Play while you wait: Santa crashed his sleigh. Slide the tree to catch the presents (and dodge the coal) so he can fly again.
(function () {
  var cv = document.getElementById('game'), pic = document.getElementById('pic'), btn = document.getElementById('play');
  var W = 320, H = 230, G = 196, x = cv.getContext('2d'), dpr = Math.min(3, window.devicePixelRatio || 1), KEY = 'treeinator-santa-best';
  cv.style.aspectRatio = W + '/' + H;
  function fit() {   // drawn sharp at whatever size the screen gives it (phone, iPad, computer)
    var r = cv.getBoundingClientRect(), k = (r.width || W) / W * Math.min(3, window.devicePixelRatio || 1);
    cv.width = Math.round(W * k); cv.height = Math.round(H * k); x.setTransform(k, 0, 0, k, 0, 0);
  }
  cv.style.setProperty('--ar', W / H); addEventListener('resize', function () { if (!cv.hidden) fit(); });
  var best = 0; try { best = +localStorage.getItem(KEY) || 0; } catch (e) {}
  var NEED = 12, COL = [['#e03131', '#f2c14e'], ['#4dabf7', '#fff'], ['#2f9e44', '#e03131'], ['#b197fc', '#ffd43b'], ['#f783ac', '#fff']];
  var s, raf = 0, last = 0, keys = {};
  function reset() { s = { px: W / 2, tx: null, items: [], t: 0, next: 0.6, got: 0, total: 0, lives: 3, level: 1, over: false, fly: 0, puffs: [], msg: '', msgT: 0, flash: 0 }; }
  function start() { pic.hidden = true; cv.hidden = false; fit(); btn.textContent = 'Start over'; reset(); last = 0; cancelAnimationFrame(raf); raf = requestAnimationFrame(loop); }
  btn.onclick = function () { start(); };
  function aim(e) { var r = cv.getBoundingClientRect(); s.tx = (e.clientX - r.left) / r.width * W; }
  cv.addEventListener('pointerdown', function (e) { e.preventDefault(); if (s.over) { reset(); return; } aim(e); cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointermove', function (e) { if (e.buttons || e.pointerType === 'mouse') aim(e); });
  addEventListener('keydown', function (e) { if (cv.hidden) return; if (/Arrow(Left|Right)/.test(e.code)) { e.preventDefault(); keys[e.code] = 1; s.tx = null; } if (e.code === 'Space' && s.over) { e.preventDefault(); reset(); } });
  addEventListener('keyup', function (e) { delete keys[e.code]; });
  function sleighX() { return W / 2 + Math.sin(s.t * 0.7) * 70; }
  function loop(ts) {
    var dt = last ? Math.min(0.05, (ts - last) / 1000) : 0; last = ts;
    if (!s.over) step(dt);
    draw(); raf = requestAnimationFrame(loop);
  }
  function step(dt) {
    s.t += dt; s.msgT -= dt; s.flash -= dt;
    var sp = 190;
    if (keys.ArrowLeft) s.px -= sp * dt; if (keys.ArrowRight) s.px += sp * dt;
    if (s.tx != null) { var d = s.tx - s.px; s.px += Math.max(-sp * 1.6 * dt, Math.min(sp * 1.6 * dt, d)); }
    s.px = Math.max(16, Math.min(W - 16, s.px));
    if (s.fly > 0) { s.fly -= dt; if (s.fly <= 0) { s.level++; s.got = 0; s.msg = 'Oh no, he crashed again! Level ' + s.level; s.msgT = 2.2; } return; }
    s.next -= dt;
    if (s.next <= 0) {
      var coal = Math.random() < Math.min(0.35, 0.12 + s.level * 0.05);
      s.items.push({ x: sleighX() + (Math.random() - 0.5) * 30, y: 52, vx: (Math.random() - 0.5) * 70, vy: -60 - Math.random() * 40, coal: coal, c: COL[Math.floor(Math.random() * COL.length)], r: Math.random() * 6 });
      s.next = Math.max(0.35, 1.1 - s.level * 0.12) * (0.6 + Math.random() * 0.8);
    }
    var gr = 120 + s.level * 25;
    for (var i = s.items.length - 1; i >= 0; i--) {
      var o = s.items[i]; o.vy += gr * dt; o.x += o.vx * dt; o.y += o.vy * dt; if (o.x < 8 || o.x > W - 8) o.vx = -o.vx;
      if (o.y > G - 34 && o.y < G - 8 && Math.abs(o.x - s.px) < 20) {
        s.items.splice(i, 1);
        if (o.coal) { s.lives--; s.flash = 0.4; s.msg = 'Coal! Ouch.'; s.msgT = 1; if (s.lives <= 0) end(); }
        else { s.got++; s.total++; s.puffs.push({ x: o.x, y: G - 40, t: 0 }); if (s.got >= NEED) { s.fly = 2.6; s.items = []; s.msg = 'Sleigh fixed! Ho ho ho!'; s.msgT = 2.6; } }
      } else if (o.y > G + 10) s.items.splice(i, 1);
    }
    s.puffs.forEach(function (p) { p.t += dt; }); s.puffs = s.puffs.filter(function (p) { return p.t < 0.8; });
  }
  function end() { s.over = true; if (s.total > best) { best = s.total; try { localStorage.setItem(KEY, best); } catch (e) {} } }
  function present(px, py, c, r) {
    x.save(); x.translate(px, py); x.rotate(r || 0); x.fillStyle = c[0]; x.fillRect(-7, -7, 14, 14); x.fillStyle = c[1]; x.fillRect(-1.5, -7, 3, 14); x.fillRect(-7, -1.5, 14, 3);
    x.beginPath(); x.arc(-3, -9, 3, 0, 7); x.arc(3, -9, 3, 0, 7); x.fill(); x.restore();
  }
  function draw() {
    x.fillStyle = '#0A0E15'; x.fillRect(0, 0, W, H);
    x.fillStyle = '#fff'; for (var i = 0; i < 40; i++) { x.globalAlpha = 0.25 + 0.5 * Math.abs(Math.sin(s.t + i)); x.fillRect((i * 83) % W, (i * 41) % 150, 1.5, 1.5); }
    x.globalAlpha = 0.5; for (var i = 0; i < 25; i++) { x.fillRect((i * 57 + Math.sin(s.t + i) * 8) % W, (i * 31 + s.t * 25) % G, 2, 2); } x.globalAlpha = 1;
    x.fillStyle = '#e9eef3'; x.fillRect(0, G, W, H - G); x.fillStyle = '#cfd8e0'; x.fillRect(0, G, W, 3);
    // the sleigh: wobbling and smoking while it's broken, flying off when fixed
    var sx = sleighX(), sy = 46, tilt = 0.25 + Math.sin(s.t * 9) * 0.05;
    if (s.fly > 0) { var k = 2.6 - s.fly; sx += k * 120; sy -= k * 22; tilt = -0.15; }
    x.save(); x.translate(sx, sy); x.rotate(tilt);
    x.fillStyle = '#a5651f'; x.beginPath(); x.moveTo(-60, 4); x.lineTo(-32, 4); x.lineTo(-34, -4); x.lineTo(-58, -4); x.fill(); // reindeer, a bit dazed
    x.fillStyle = '#c99a5b'; x.beginPath(); x.arc(-56, -8, 5, 0, 7); x.fill(); x.strokeStyle = '#8a5a2b'; x.lineWidth = 1.5; x.beginPath(); x.moveTo(-58, -12); x.lineTo(-62, -20); x.moveTo(-55, -12); x.lineTo(-52, -20); x.stroke();
    x.fillStyle = '#e03131'; x.beginPath(); x.arc(-60, -8, 2, 0, 7); x.fill();
    x.strokeStyle = '#c99a5b'; x.beginPath(); x.moveTo(-32, 0); x.lineTo(-20, 2); x.stroke();
    x.fillStyle = '#c92a2a'; x.beginPath(); x.moveTo(-20, -10); x.lineTo(22, -10); x.quadraticCurveTo(30, -10, 28, 8); x.lineTo(-16, 8); x.closePath(); x.fill();
    x.strokeStyle = '#f2c14e'; x.lineWidth = 2; x.beginPath(); x.moveTo(-22, 12); x.lineTo(28, 12); x.quadraticCurveTo(36, 12, 34, 4); x.stroke();
    x.fillStyle = '#e03131'; x.beginPath(); x.arc(4, -16, 8, 0, 7); x.fill(); x.fillStyle = '#f8d8c0'; x.beginPath(); x.arc(4, -20, 5, 0, 7); x.fill();
    x.fillStyle = '#fff'; x.beginPath(); x.arc(4, -15, 4.5, 0, Math.PI); x.fill(); x.fillStyle = '#e03131'; x.beginPath(); x.moveTo(-1, -23); x.lineTo(9, -23); x.lineTo(13, -31); x.fill(); x.fillStyle = '#fff'; x.beginPath(); x.arc(13, -31, 2, 0, 7); x.fill();
    x.restore();
    if (s.fly <= 0) { x.fillStyle = '#9aa1ad'; for (var i = 0; i < 4; i++) { var a = (s.t * 0.9 + i / 4) % 1; x.globalAlpha = 0.6 * (1 - a); x.beginPath(); x.arc(sx + 26 + a * 14, sy - 8 - a * 26, 4 + a * 8, 0, 7); x.fill(); } x.globalAlpha = 1; }
    else { x.fillStyle = '#f2c14e'; for (var i = 0; i < 8; i++) { x.globalAlpha = 0.8 - i * 0.1; x.fillRect(sx - 70 - i * 10, sy + 8 + i * 2, 3, 3); } x.globalAlpha = 1; }
    // falling things
    s.items.forEach(function (o) {
      if (o.coal) { x.fillStyle = '#2b2b2b'; x.beginPath(); x.arc(o.x, o.y, 6.5, 0, 7); x.fill(); x.fillStyle = '#555'; x.fillRect(o.x - 3, o.y - 3, 2, 2); }
      else present(o.x, o.y, o.c, o.r + s.t * 2);
    });
    // the tree (the catcher), with a sack
    var px = s.px, by = G, b = Math.abs(Math.sin(s.t * 12)) * (s.tx != null && Math.abs(s.tx - px) > 2 || keys.ArrowLeft || keys.ArrowRight ? 2 : 0);
    x.save(); x.translate(px, by - b); if (s.flash > 0 && Math.floor(s.flash * 20) % 2) x.globalAlpha = 0.4;
    x.fillStyle = '#6b3f1f'; x.fillRect(-3, -8, 6, 8);
    x.fillStyle = '#2f9e44'; [[-38, -12, -24, 12, -24], [-30, -14, -12, 14, -12], [-22, -16, -2, 16, -2]].forEach(function (p) { x.beginPath(); x.moveTo(0, p[0]); x.lineTo(p[1], p[2]); x.lineTo(p[3], p[4]); x.fill(); });
    x.fillStyle = '#f2c14e'; x.beginPath(); x.arc(0, -39, 3.5, 0, 7); x.fill();
    var c = ['#e03131', '#f2c14e', '#4dabf7', '#f783ac']; [[-6, -22], [6, -18], [-9, -8], [9, -6], [0, -12]].forEach(function (p, i) { x.fillStyle = c[(i + Math.floor(s.t * 5)) % 4]; x.beginPath(); x.arc(p[0], p[1], 1.8, 0, 7); x.fill(); });
    x.fillStyle = '#111'; x.fillRect(-4, -18, 2, 3); x.fillRect(3, -18, 2, 3);
    x.fillStyle = '#8b5e34'; x.beginPath(); x.ellipse(0, -1, 18, 6, 0, 0, Math.PI); x.fill(); x.fillRect(-18, -3, 36, 3);
    x.restore();
    s.puffs.forEach(function (p) { x.globalAlpha = 1 - p.t / 0.8; x.fillStyle = '#f2c14e'; x.font = '700 12px system-ui,sans-serif'; x.textAlign = 'center'; x.fillText('+1', p.x, p.y - p.t * 30); }); x.globalAlpha = 1;
    // what's needed to fix the sleigh
    x.textAlign = 'left'; x.font = '700 11px system-ui,sans-serif'; x.fillStyle = '#f2c14e';
    x.fillStyle = '#5c6b78'; x.fillText('Sleigh repair', 8, H - 12); x.fillStyle = '#c3ccd5'; x.fillRect(88, H - 21, 120, 9); x.fillStyle = '#2f9e44'; x.fillRect(88, H - 21, 120 * Math.min(1, s.got / NEED), 9);
    x.fillStyle = '#e03131'; x.textAlign = 'right'; x.font = '13px sans-serif'; x.fillText('♥♥♥'.slice(0, Math.max(0, s.lives)), W - 8, H - 11);
    x.fillStyle = '#f2c14e'; x.font = '700 12px system-ui,sans-serif'; x.fillText('🎁 ' + s.total + (best ? '   best ' + best : ''), W - 8, 16);
    x.textAlign = 'center';
    if (s.over) { x.fillStyle = '#0A0E15cc'; x.fillRect(30, 70, W - 60, 56); x.fillStyle = '#f2c14e'; x.font = '800 16px system-ui,sans-serif'; x.fillText('Santa’s stuck! ' + s.total + ' presents saved', W / 2, 94); x.font = '600 12px system-ui,sans-serif'; x.fillText('tap to try again', W / 2, 114); }
    else if (s.msgT > 0) { x.fillStyle = '#f2c14e'; x.font = '800 15px system-ui,sans-serif'; x.fillText(s.msg, W / 2, 100); }
    else if (s.t < 3) { x.fillStyle = '#f2c14e'; x.font = '600 12px system-ui,sans-serif'; x.fillText('Santa crashed his sleigh!', W / 2, 92); x.fillText('Slide to catch the presents, dodge the coal.', W / 2, 108); }
  }
})();
</script>
</body></html>
