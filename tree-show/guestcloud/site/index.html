<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1a12">
<title>Light Up the Tree</title>
<meta name="description" content="Pick what the Christmas tree shows next.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{--bg:#0b1a12;--card:#12261b;--line:#24402f;--ink:#f3f6f1;--dim:#a9bdb0;--gold:#f2c14e;--red:#e0483e;--green:#3fbf6f}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:0 0 92px}
main{max-width:560px;margin:0 auto;padding:0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 11px;margin-top:8px}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--gold);font-weight:700;margin:0 0 6px}
.hide{display:none!important}
/* scene with the title */
.scene{position:relative;height:74px;overflow:hidden;background:linear-gradient(#05101c,#0b1a12)}
.scene svg{position:absolute;inset:0;width:100%;height:100%}
.scene h1{position:absolute;left:14px;bottom:12px;margin:0;font-size:22px;line-height:1.05;max-width:62%;text-shadow:0 2px 8px #000}
.scene h1 span{color:var(--gold)}
/* now + line */
.now{display:flex;gap:10px;align-items:center}
.now .txt{flex:1;min-width:0}
.now b{overflow-wrap:anywhere}
.now small{color:var(--dim);display:block}
.dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);flex:none;animation:pulse 1.6s infinite}
.closed .dot{background:#c77;box-shadow:none;animation:none}
@keyframes pulse{50%{opacity:.35}}
/* the line: one summary row ("Up next · 4  Starburst, Candy cane…"), tap to see everyone */
.next{display:flex;align-items:center;gap:6px;width:100%;margin-top:7px;padding:5px 8px;font:inherit;font-size:13px;color:var(--dim);background:#0d1c14;border:1px solid var(--line);border-radius:8px;text-align:left}
.next #nextTxt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.next b{color:var(--ink)}.next .me{color:var(--gold)}
.next .arr{flex:none;transition:transform .2s}.next[aria-expanded=true] .arr{transform:rotate(180deg)}
.q{list-style:none;margin:0;padding:6px 10px;position:absolute;left:-1px;right:-1px;top:calc(100% - 6px);z-index:20;max-height:min(55vh,360px);overflow:auto;background:#0f2418;border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px;box-shadow:0 14px 30px #000c}
#nowCard{position:relative}
.q li{display:flex;gap:6px;align-items:center;padding:5px 2px;font-size:13px;border-top:1px solid #1c3326}
.q li:first-child{border-top:0}
.q .n{width:18px;color:var(--dim);text-align:right;flex:none;font-variant-numeric:tabular-nums}
.q .w{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q .mine{color:var(--gold)}.q .mine .n{color:var(--gold);font-weight:700}
.q small{color:var(--dim)}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-left:2px;vertical-align:-1px;border:1px solid #0006}
.x{background:none;border:0;color:var(--dim);font:inherit;font-size:13px;text-decoration:underline;margin-left:auto}
/* picking: category row and design row, both scroll sideways */
.row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.row::-webkit-scrollbar{display:none}
.cats button{font:inherit;font-size:13px;white-space:nowrap;color:var(--dim);background:none;border:1px solid var(--line);border-radius:999px;padding:5px 11px;flex:none}
.cats button[aria-pressed=true]{color:#1d1600;background:var(--gold);border-color:var(--gold);font-weight:600}
.designs{display:grid;grid-auto-flow:column;grid-template-rows:repeat(4,auto);grid-auto-columns:max-content;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:8px;padding-bottom:2px}
.designs::-webkit-scrollbar{display:none}
.chip{font:inherit;font-size:14px;color:var(--ink);background:#173123;border:1px solid var(--line);border-radius:10px;padding:6px 10px;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--ink);color:#0b1a12;border-color:var(--ink);font-weight:700}
/* sideways rows: a soft fade and a gold chevron on whichever side has more (cue()) */
.scroller{position:relative}
.scroller::before,.scroller::after{position:absolute;top:0;bottom:2px;width:30px;display:flex;align-items:center;color:var(--gold);font-size:22px;font-weight:700;pointer-events:none;opacity:0;transition:opacity .25s;z-index:2}
.scroller::after{content:'\203A';right:-2px;justify-content:flex-end;padding-right:2px;background:linear-gradient(90deg,transparent,var(--card) 65%)}
.scroller::before{content:'\2039';left:-2px;justify-content:flex-start;padding-left:2px;background:linear-gradient(270deg,transparent,var(--card) 65%)}
.scroller.more-r::after,.scroller.more-l::before{opacity:1}
.scroller.more-r::after{animation:nudge 1.6s ease-in-out 3}
@keyframes nudge{50%{transform:translateX(3px)}}
.designs.hint{animation:peek 1.2s ease-in-out 1 .6s}
@keyframes peek{40%{transform:translateX(-26px)}}
input[type=search],input[type=text]{width:100%;font:inherit;font-size:16px;color:var(--ink);background:#0d1c14;border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-width:0}
input:focus{outline:2px solid var(--gold);outline-offset:1px}
/* preview beside colors and message */
.make{display:grid;grid-template-columns:108px minmax(0,1fr);gap:12px;align-items:start}
canvas{width:108px;height:144px;display:block;border-radius:9px;background:#05080a}
.pname{font-size:12px;color:var(--dim);text-align:center;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pal{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.pal button{aspect-ratio:1;border-radius:8px;border:2px solid #0006;position:relative;padding:0}
.pal button[aria-pressed=true]{outline:3px solid var(--ink);outline-offset:1px}
.pal button b{position:absolute;right:1px;bottom:-1px;font-size:10px;color:#000;text-shadow:0 0 3px #fff}
.pal .own{background:conic-gradient(#ff3b3b,#ffd23b,#3fbf6f,#3bb3ff,#b05cff,#ff3b3b);font-size:9px;color:#fff;font-weight:700;text-shadow:0 0 3px #000}
.msgrow{display:flex;gap:6px;margin-top:10px}
.msgrow button{font:inherit;font-size:18px;background:#173123;color:var(--red);border:1px solid var(--line);border-radius:9px;width:40px;flex:none}
.hint{color:var(--dim);font-size:12px;margin:4px 0 0}
/* the button and messages */
.go{position:fixed;left:0;right:0;bottom:0;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 35%)}
.go div{max-width:560px;margin:0 auto}
.go p{margin:0 0 6px;font-size:14px;text-align:center;min-height:1.2em;color:#ffb4a8;text-shadow:0 1px 4px #000}
.go p.ok{color:#bff0cf}
.go button svg{width:24px;height:24px;vertical-align:-6px;margin-right:8px}
.go button:disabled svg{opacity:.5}
.go button{width:100%;font:inherit;font-size:17px;font-weight:700;padding:13px;border:0;border-radius:13px;background:var(--red);color:#fff;box-shadow:0 6px 20px #0008}
.go button:disabled{background:#4b3a38;color:#c9b4b0}
/* typing a message: the button stops floating (it would sit on top of the keyboard and the box), the box scrolls into view */
body.tight .scene{height:56px}body.tight .scene h1{font-size:19px;bottom:8px}
body.tight canvas{width:90px;height:120px}body.tight .make{grid-template-columns:90px minmax(0,1fr)}
body.tight .hint{display:none}
/* typing: the button rides just above the keyboard (placeGo), with room to scroll the box above it */
body.typing{padding-bottom:45vh}
body.typing .go p{display:none}
/* ---- the scene: a tree in a Santa hat, and Santa flying by (original cartoon) ---- */
.star{animation:tw 3s infinite ease-in-out}
@keyframes tw{50%{opacity:.2}}
.tree{transform-box:fill-box;transform-origin:50% 100%;animation:sway 4s infinite ease-in-out}
@keyframes sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
.tree.happy{animation:hop .9s 2 ease-out}
@keyframes hop{0%,100%{transform:translateY(0) scale(1)}30%{transform:translateY(-14px) scale(1.04,.97)}60%{transform:translateY(0) scale(1.06,.92)}}
.bulb{animation:tw 1.4s infinite}
.pom{transform-box:fill-box;transform-origin:0 0;animation:flop 4s infinite ease-in-out}
@keyframes flop{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(14deg)}}
.lid{transform-box:fill-box;transform-origin:50% 0;animation:blink 5s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(0)}95%{transform:scaleY(1)}}
.pupil{animation:look 7s infinite ease-in-out}
@keyframes look{0%,40%{transform:translate(0,0)}50%,70%{transform:translate(2.5px,-1.5px)}80%,100%{transform:translate(-2.5px,0)}}
.sleigh{animation:fly 16s infinite linear}
@keyframes fly{0%{transform:translate(-160px,92px)}45%{transform:translate(900px,80px)}100%{transform:translate(900px,80px)}}
.bob{animation:bob 1s infinite ease-in-out}
@keyframes bob{50%{transform:translateY(-6px)}}
.ho{opacity:0;animation:ho 16s infinite}
@keyframes ho{12%,13%{opacity:0}16%,30%{opacity:1}33%{opacity:0}}
.gift{opacity:0}
.gift.drop{animation:drop 1.1s ease-in forwards}
@keyframes drop{0%{opacity:1;transform:translate(0,-140px) rotate(-30deg)}85%{opacity:1;transform:translate(0,0) rotate(10deg)}100%{opacity:0;transform:translate(0,4px)}}
/* closed or paused: a loud card, the rest dims, the tree sleeps, the TV shows its test pattern */
#nowCard.closed{background:#3a1511;border:2px solid #e0483e;box-shadow:0 0 0 3px #e0483e22}
#nowCard.closed.paused{background:#33280c;border-color:#f2c14e;box-shadow:0 0 0 3px #f2c14e22}
#nowCard.closed.resting{background:#161a3a;border-color:#7d8cff;box-shadow:0 0 0 3px #7d8cff22}
.badge{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.9px;padding:3px 8px;border-radius:6px;background:#e0483e;color:#fff;margin:0 0 4px}
.paused .badge{background:#f2c14e;color:#2a1c00}.resting .badge{background:#7d8cff;color:#0b0f2a}
#nowCard.closed .txt b{font-size:15px}
body.closedMode main .card:not(#nowCard){opacity:.42;filter:saturate(.5)}
.zzz,.bars{display:none}
body.closedMode .zzz,body.closedMode .bars{display:inline}
body.closedMode .scr,body.closedMode .static,body.closedMode .beam{display:none}
body.closedMode .lid{animation:none;transform:scaleY(1)}
body.closedMode .pupil{display:none}
.zzz text{animation:zz 3s infinite ease-out;opacity:0}
.zzz text:nth-child(2){animation-delay:1s}.zzz text:nth-child(3){animation-delay:2s}
@keyframes zz{0%{opacity:0;transform:translate(0,0)}20%{opacity:1}100%{opacity:0;transform:translate(8px,-14px)}}
/* the remote zaps the TV every 5 s: a beam, a flash of static, another channel */
.beam,.static{opacity:0}
.beam{animation:zap 5s infinite}
@keyframes zap{0%,68%{opacity:0}70%,78%{opacity:1}80%,100%{opacity:0}}
.led{animation:led 5s infinite}
@keyframes led{0%,68%,80%,100%{fill:#5a2a2a}70%,78%{fill:#ff6060}}
.static{animation:stat 5s infinite steps(1)}
@keyframes stat{0%,76%{opacity:0}77%{opacity:.9}79%{opacity:.6}81%{opacity:.85}83%,100%{opacity:0}}
.chan{animation:chan 20s infinite steps(1)}
@keyframes chan{0%{fill:#0c3a24}25%{fill:#3a0c12}50%{fill:#0c1f3a}75%{fill:#2e2a08}}
@media (prefers-reduced-motion:reduce){.scene *{animation:none!important}}
</style>
</head>

<main>
<div class="card" id="nowCard">
 <div class="now"><span class="dot"></span><div class="txt" id="nowTxt">Checking…</div></div>
 <button type="button" class="next hide" id="lineBtn" aria-expanded="false"><span id="nextTxt"></span><span class="arr">▾</span></button>
 <ol class="q hide" id="q"></ol>
</div>

<div class="card">
 <div class="scroller"><div class="row cats" id="cats" role="tablist" aria-label="Categories"></div></div>
 <div class="scroller"><div class="designs" id="designs" aria-label="Designs"></div></div>
</div>

<div class="card make">
 <div><canvas id="cv" width="236" height="314" aria-label="Preview of your pick on the tree"></canvas><div class="pname" id="pickName">Pick a design</div></div>
 <div>
  <div class="lbl">Colors</div>
  <div class="pal" id="pal"></div>
  <div class="msgrow"><input type="text" id="msg" maxlength="24" placeholder="Message (optional)" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Message"><button type="button" id="heart" title="Add a heart" aria-label="Add a heart">♥</button></div>
  <p class="hint"><span id="count">0/24</span> · keep it friendly</p>
 </div>
</div>
</main>
<div class="go" id="goBar"><div><p id="err" role="status"></p><button type="button" id="go" disabled>Pick a design</button></div></div>

<script>
'use strict';
var $ = function (id) { return document.getElementById(id); };
var PAL = [['#ff1a1a','Red'],['#ff7a00','Orange'],['#ffd400','Gold'],['#2ee66b','Green'],['#00c8ff','Ice'],['#2b5cff','Blue'],['#8a2bff','Purple'],['#ff4fd8','Pink'],['#ffffff','White']];
var CAT = null, E = null, G = null, sel = null, colors = [], tickets = [], curCat = null, lineOpen = false;
var PER_GUEST = 13; // requests one phone may have waiting right now (the site says: it shrinks when the line is busy)
try { tickets = JSON.parse(localStorage.getItem('treeTickets') || '[]').filter(function (t) { return typeof t === 'string'; }).slice(-25); } catch (e) {}
function saveTickets() { try { localStorage.setItem('treeTickets', JSON.stringify(tickets)); } catch (e) {} }
var ALLOWED = /^[A-Z0-9 !?.,'\-&*+#:♥]*$/;

function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function showMsg(s) { return esc(s).replace(/&lt;/g, '♥'); } // the tree draws '<' as a heart
function swatches(cs) { return (cs || []).map(function (c) { return '<span class="sw" style="background:' + esc(c) + '"></span>'; }).join(''); }
function say(text, ok) { $('err').textContent = text || ''; $('err').className = ok ? 'ok' : ''; }
function api(path, body) {
  return fetch('api/' + path, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : { cache: 'no-store' })
    .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) throw new Error(j.error || 'Something went wrong. Try again.'); return j; }); });
}
function load(src) { return new Promise(function (ok, no) { var s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s); }); }

// ---------- what's on, and the line ----------
var lastQ = null;
function drawQueue(q) {
  lastQ = q; if (q.perGuest) PER_GUEST = q.perGuest;
  var why = q.open ? '' : q.why || 'closed', nc = $('nowCard');
  nc.className = 'card' + (q.open ? '' : ' closed ' + why);
  document.body.classList.toggle('closedMode', !q.open);
  var t;
  if (!q.open) t = '<div class="badge">' + ({ paused: '⏸ PAUSED', resting: '💤 RESTING', live: '🎛 LIVE SHOW', offline: 'OFFLINE' }[why] || 'CLOSED') + '</div><br><b>' + esc(q.reason || 'The tree isn’t taking requests right now.') + '</b>';
  else if (q.now) t = '<b>' + esc(q.now.name) + '</b>' + swatches(q.now.colors) + (q.now.msg ? ' “' + showMsg(q.now.msg) + '”' : '') + '<small>' + (q.now.mine ? 'Yours! 🎄 ' : 'A guest’s pick · ') + q.now.left + ' s left</small>';
  else t = '<b>The tree’s own show</b><small>Yours could be next!</small>';
  $('nowTxt').innerHTML = t;
  var mine = [];
  $('q').innerHTML = q.items.map(function (it, i) {
    if (it.mine) mine.push(i);
    return '<li class="' + (it.mine ? 'mine' : '') + '"><span class="n">' + it.pos + '</span><span class="w">' + (it.mine ? '★ ' : '') + esc(it.name) + swatches(it.colors) + (it.msg ? ' <small>“' + showMsg(it.msg) + '”</small>' : '') + '</span>' + (it.mine ? '<button class="x" type="button" data-cancel="' + esc(it.t) + '">Cancel</button>' : '') + '</li>';
  }).join('');
  $('q').querySelectorAll('[data-cancel]').forEach(function (c) { c.onclick = function () { cancel(c.dataset.cancel); }; });
  // forget tickets that have played (or were cleared)
  var live = q.items.filter(function (i) { return i.mine; }).map(function (i) { return i.t; });
  var playing = !!(q.now && q.now.mine); // the one on the tree has left the line: keep it until it's done
  var keep = tickets.filter(function (t) { return live.indexOf(t) >= 0 || playing; });
  if (keep.length !== tickets.length) { tickets = keep; saveTickets(); }
  myCount = mine.length;
  // one line: how many, yours, and the next few names
  var names = q.items.slice(0, 3).map(function (it) { return esc(it.name); }).join(', ') + (q.items.length > 3 ? '…' : '');
  $('nextTxt').innerHTML = '<b>Up next · ' + q.items.length + '</b>' + (mine.length ? ' <span class="me">(' + mine.length + ' yours)</span>' : '') + ' ' + names;
  if (!q.items.length) lineOpen = false;
  $('lineBtn').classList.toggle('hide', !q.items.length);
  $('lineBtn').setAttribute('aria-expanded', String(lineOpen));
  $('q').classList.toggle('hide', !lineOpen);
  if (q.now && q.now.mine) say('That’s yours on the tree now! 🎄' + (mine.length ? ' · ' + mine.length + ' more in line' : ''), true);
  else if (mine.length) {
    var wait = (q.now ? q.now.left : 0) + mine[0] * (q.sec || 45);
    say((mine.length > 1 ? 'You have ' + mine.length + ' in line: number ' + mine.map(function (i) { return i + 1; }).join(', ') : 'You’re number ' + (mine[0] + 1) + ' in line') + ' · next in about ' + (wait < 60 ? 'less than a minute' : Math.round(wait / 60) + ' min'), true);
  } else if ($('err').className === 'ok') say('');
  setGo();
}
$('lineBtn').onclick = function (e) { e.stopPropagation(); lineOpen = !lineOpen; if (lastQ) drawQueue(lastQ); };
document.addEventListener('click', function (e) { if (lineOpen && !$('q').contains(e.target)) { lineOpen = false; if (lastQ) drawQueue(lastQ); } });
var myCount = 0;
function poll() { fetch('api/queue' + (tickets.length ? '?t=' + encodeURIComponent(tickets.join(',')) : ''), { cache: 'no-store' }).then(function (r) { return r.json(); }).then(drawQueue).catch(function () {}); }
function cancel(t) {
  api('cancel', { t: t }).then(function () { tickets = tickets.filter(function (x) { return x !== t; }); saveTickets(); say('Cancelled.'); poll(); }).catch(function (e) { say(e.message); });
}

// ---------- picking: a row of categories (favorites first), a row of designs ----------
var groups = {}, order = [];
function buildLists() {
  var byId = {}; CAT.designs.forEach(function (d) { byId[d.id] = d; });
  var favs = (CAT.favorites || []).map(function (id) { return byId[id]; }).filter(Boolean);
  CAT.designs.forEach(function (d) { var c = d.cat || 'Other'; if (!groups[c]) { groups[c] = []; order.push(c); } groups[c].push(d); });
  var rank = (E && E.CATS) || [];
  order.sort(function (a, b) { var x = rank.indexOf(a), y = rank.indexOf(b); return (x < 0 ? 999 : x) - (y < 0 ? 999 : y); });
  if (favs.length) { groups['★ Favorites'] = favs; order.unshift('★ Favorites'); }
  order.forEach(function (c) {
    var b = document.createElement('button'); b.type = 'button'; b.textContent = c.replace('Christmas · ', ''); b.title = c; b.dataset.c = c;
    b.onclick = function () { showCat(c); b.scrollIntoView({ inline: 'nearest', block: 'nearest', behavior: 'smooth' }); }; $('cats').appendChild(b);
  });
  showCat(order[0]);
}
function showList(list) {
  var w = $('designs'); w.innerHTML = '';
  list.forEach(function (d) {
    var b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.textContent = d.name; b.dataset.id = d.id;
    b.setAttribute('aria-pressed', String(!!sel && sel.id === d.id)); b.onclick = function () { pick(d.id); }; w.appendChild(b);
  });
  w.scrollLeft = 0; cue(w);
}
function showCat(c) {
  curCat = c;
  document.querySelectorAll('#cats button[data-c]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.c === c)); });
  showList(groups[c] || []);
}
// "more this way" cues on the sideways rows
function cue(el) {
  var w = el.parentNode;
  w.classList.toggle('more-r', el.scrollLeft + el.clientWidth < el.scrollWidth - 4);
  w.classList.toggle('more-l', el.scrollLeft > 4);
}
['cats', 'designs'].forEach(function (id) { $(id).addEventListener('scroll', function () { cue(this); }, { passive: true }); });
window.addEventListener('resize', function () { cue($('cats')); cue($('designs')); });
function pick(id) {
  sel = CAT.designs.find(function (d) { return d.id === id; }) || null;
  document.querySelectorAll('.chip').forEach(function (b) { b.setAttribute('aria-pressed', String(!!sel && b.dataset.id === sel.id)); });
  $('pickName').textContent = sel ? sel.name : 'Pick a design';
  restartPreview(); setGo();
}

// ---------- colors: the design's own (first square), or one or two picked ----------
(function () {
  var own = document.createElement('button'); own.type = 'button'; own.className = 'own'; own.textContent = 'OWN'; own.title = 'The design’s own colors'; own.setAttribute('aria-label', 'The design’s own colors');
  own.onclick = function () { colors = []; drawPal(); restartPreview(); }; $('pal').appendChild(own);
  PAL.forEach(function (p) {
    var b = document.createElement('button'); b.type = 'button'; b.style.background = p[0]; b.title = p[1]; b.setAttribute('aria-label', p[1]); b.dataset.c = p[0];
    b.onclick = function () { var i = colors.indexOf(p[0]); if (i >= 0) colors.splice(i, 1); else { colors.push(p[0]); if (colors.length > 2) colors.shift(); } drawPal(); restartPreview(); };
    $('pal').appendChild(b);
  });
  drawPal();
})();
function drawPal() {
  document.querySelectorAll('#pal button').forEach(function (b) {
    if (!b.dataset.c) { b.setAttribute('aria-pressed', String(!colors.length)); return; }
    var i = colors.indexOf(b.dataset.c); b.setAttribute('aria-pressed', String(i >= 0)); b.innerHTML = i >= 0 && colors.length > 1 ? '<b>' + (i + 1) + '</b>' : '';
  });
}

// ---------- message ----------
function msgVal() { return $('msg').value.toUpperCase().replace(/[‘’]/g, "'"); }
$('msg').oninput = function () {
  var v = msgVal(); $('count').textContent = v.length + '/24';
  say(ALLOWED.test(v) ? '' : 'The tree can show letters, numbers and simple punctuation.');
  restartPreview(); setGo();
};
// One phone screen, always: fewer rows of designs on shorter phones (4 on most, down to 2).
var ROWS = 4;
function fit() {
  if (document.body.classList.contains('typing')) return;     // the keyboard is up: scrolling to the box is fine
  var g = $('designs'), fits = function () { return document.documentElement.scrollHeight <= window.innerHeight + 1; };
  var tries = function () { for (ROWS = 4; ROWS >= 2; ROWS--) { g.style.gridTemplateRows = 'repeat(' + ROWS + ',auto)'; if (fits()) return true; } return false; };
  document.body.classList.remove('tight');
  if (!tries()) { document.body.classList.add('tight'); tries(); } // small phones: smaller banner and preview too
}
window.addEventListener('resize', function () { clearTimeout(fit.t); fit.t = setTimeout(fit, 120); });
// The phone's keyboard: keep the message box in sight above it.
// The button sits on top of the keyboard: the keyboard shrinks the visible area (visualViewport), not the page.
function placeGo() {
  var vv = window.visualViewport, off = vv ? Math.max(0, window.innerHeight - vv.height - vv.offsetTop) : 0;
  $('goBar').style.bottom = off + 'px';
}
// Scroll so the message box sits just above the button.
function boxInView() {
  placeGo();
  var vv = window.visualViewport, top = vv ? vv.offsetTop : 0, h = vv ? vv.height : window.innerHeight;
  var r = $('msg').getBoundingClientRect(), barTop = top + h - $('goBar').offsetHeight;
  var want = barTop - 12, d = r.bottom - want;
  if (d > 0 || r.top < top + 8) window.scrollBy({ top: r.top < top + 8 ? r.top - top - 8 : d, behavior: 'smooth' });
}
$('msg').addEventListener('focus', function () { document.body.classList.add('typing'); setTimeout(boxInView, 350); });
$('msg').addEventListener('blur', function () { setTimeout(function () { if (document.activeElement !== $('msg')) { document.body.classList.remove('typing'); fit(); } }, 150); });
if (window.visualViewport) {
  visualViewport.addEventListener('resize', function () { placeGo(); if (document.activeElement === $('msg')) boxInView(); });
  visualViewport.addEventListener('scroll', placeGo);
}
$('heart').onclick = function () { var m = $('msg'); if (m.value.length < 24) { m.value += '♥'; m.oninput(); } };
$('heart').addEventListener('mousedown', function (e) { e.preventDefault(); }); // keep the keyboard up
var ZAP = '<svg viewBox="0 0 24 24" aria-hidden="true"><g transform="rotate(-35 8 15)"><rect x="5" y="9" width="6" height="13" rx="1.6" fill="#fff"/><circle cx="8" cy="12" r="1.2" fill="#e0483e"/><circle cx="7" cy="15.5" r=".7" fill="#e0483e"/><circle cx="9" cy="15.5" r=".7" fill="#e0483e"/><circle cx="7" cy="18" r=".7" fill="#e0483e"/><circle cx="9" cy="18" r=".7" fill="#e0483e"/></g><path d="M14 4l2 3M18 3l-.2 3.4M20.5 6.5l-3 1.6" stroke="#ffd23b" stroke-width="1.8" stroke-linecap="round"/></svg>';
function inLine() { return myCount >= PER_GUEST; }
function setGo() {
  var b = $('go'), open = lastQ && lastQ.open, v = msgVal();
  b.disabled = !sel || !open || !ALLOWED.test(v) || inLine();
  var why = lastQ && !open ? lastQ.why : '', closedTxt = why === 'resting' ? (lastQ.back ? 'Opens ' + lastQ.back : 'The tree is resting') : why === 'paused' ? 'Paused · check back soon' : why === 'live' ? 'Live show on · back in a minute' : why === 'offline' ? 'The tree is offline' : 'Closed right now';
  b.innerHTML = (open && sel && !inLine() ? ZAP : '') + (!open ? closedTxt : inLine() ? (lastQ && lastQ.busy ? 'Busy line · wait for one of yours' : 'You’re lined up · wait for one to play') : !sel ? 'Pick a design' : myCount ? 'Add it to the line' : 'Put it on the tree');
}
$('go').onclick = function () {
  if (!sel) return;
  var b = $('go'); b.disabled = true; b.innerHTML = ZAP + 'Sending…';
  api('request', { id: sel.id, colors: colors, msg: msgVal().replace(/♥/g, '<') }).then(function (j) {
    tickets.push(j.t); tickets = tickets.slice(-25); saveTickets(); myCount++;
    say('You’re in line! Number ' + j.pos + '.', true); celebrate(); poll();
  }).catch(function (e) { say(e.message); setGo(); });
};
// Santa drops a present into the tree, and the tree hops for joy.
function celebrate() {
  var g = $('gift'), t = $('tree');
  g.classList.remove('drop'); t.classList.remove('happy'); void g.getBBox();
  g.classList.add('drop'); setTimeout(function () { t.classList.add('happy'); }, 900);
  setTimeout(function () { t.classList.remove('happy'); }, 2800);
}

// ---------- preview: the tree seen from the front, drawn by the tree's own engine ----------
var run = null, look = null, frame = null, ctx = $('cv').getContext('2d');
ctx.scale(236 / 300, 314 / 400);
function restartPreview() {
  if (!E || !sel) { look = null; ctx.clearRect(0, 0, 300, 400); return; }
  look = G.guestLook(sel.look, colors, msgVal().replace(/♥/g, '<'));
  run = E.newRun();
}
var lastT = 0;
function tick(t) {
  requestAnimationFrame(tick);
  if (!look) return;
  var dt = Math.min(0.1, (t - (lastT || t)) / 1000); lastT = t;
  E.render(look, run, dt, frame);
  ctx.fillStyle = '#05080a'; ctx.fillRect(0, 0, 300, 400);
  var cx = 150, top = 92, h = 290;
  for (var k = 0; k < E.N; k++) {
    var p = E.PX[k], x, y, rad, a;
    if (p.tree) { if (p.depth < -0.2) continue; x = cx + p.x * 120; y = top + p.u * h; rad = 2.4 + 0.9 * p.u; a = 0.35 + 0.65 * Math.max(0, p.depth); }
    else { if (!E.CONFIG.topper) continue; x = cx + p.tp.x * 4.2; y = 46 + p.tp.y * 4.2; rad = 2.2; a = 1; }
    var r = frame[k * 3], g = frame[k * 3 + 1], bb = frame[k * 3 + 2];
    if (Math.max(r, g, bb) < 4) continue;
    ctx.globalAlpha = a; ctx.fillStyle = 'rgb(' + (r | 0) + ',' + (g | 0) + ',' + (bb | 0) + ')';
    ctx.beginPath(); ctx.arc(x, y, rad, 0, 6.2832); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

api('catalog').then(function (c) {
  CAT = c; window.TREE_CONFIG = c.layout || {};
  if (c.title) { // the name set in tree-show (Settings -> Guests); the last word in gold
    var w = c.title.split(' '), last = w.pop();
    $('title').innerHTML = (w.length ? esc(w.join(' ')) + ' ' : '') + '<span>' + esc(last) + '</span>'; document.title = c.title;
  }
  return load('engine.js').then(function () { return load('guestlook.js'); }).then(function () {
    E = window.TreeEngine; G = window.GuestLook; frame = new Float32Array(E.N * 3);
    buildLists();
    var first = (groups[order[0]] || [])[0]; if (first) pick(first.id);
    fit(); cue($('cats')); cue($('designs'));
    if ($('designs').scrollWidth > $('designs').clientWidth + 4) { $('designs').classList.add('hint'); setTimeout(function () { $('designs').classList.remove('hint'); }, 2200); }
    requestAnimationFrame(tick);
  });
}).catch(function () { say('Couldn’t load the designs. Pull down to try again.'); });
poll(); setInterval(poll, 4000);
</script>
</body>
</html>
